<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cypher Bridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #05070d; color: #e8e6e1; font-family: system-ui, sans-serif; }
    .card { background: #0c0e16; border: 1px solid rgba(255,255,255,0.06); }
    .field { background: #141824; border: 1px solid rgba(255,255,255,0.08); }
    .btn { background: #f0762a; color: #05070d; font-weight: 600; }
    .accent { color: #f0762a; }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #1c3d32; padding: 0.75rem 1.25rem; border-radius: 0.75rem; font-size: 0.875rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 50; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div class="max-w-md mx-auto p-4 min-h-screen flex flex-col">
    <div class="flex justify-between items-center mb-6">
      <a href="https://cypheranon-dev.github.io/Maskwallet/" class="text-gray-400">←</a>
      <span class="text-sm text-gray-500">Bridge</span>
      <div class="w-4"></div>
    </div>
    <div class="card rounded-2xl p-5 flex-1 flex flex-col">
      <div class="text-lg font-semibold mb-4">Cypher Bridge</div>
      <div class="field rounded-xl p-4 mb-2">
        <div class="text-xs text-gray-500 mb-1">From</div>
        <select id="from-chain" class="bg-transparent text-lg outline-none w-full">
          <option>Ethereum</option>
          <option>Bitcoin</option>
          <option>Solana</option>
          <option>Cypher</option>
        </select>
      </div>
      <div class="text-center my-1"><div class="inline-flex w-7 h-7 rounded-full bg-[#1a1d28] items-center justify-center text-xs accent">↓</div></div>
      <div class="field rounded-xl p-4 mb-3">
        <div class="text-xs text-gray-500 mb-1">To</div>
        <select id="to-chain" class="bg-transparent text-lg outline-none w-full">
          <option>Cypher</option>
          <option>Ethereum</option>
          <option>Bitcoin</option>
          <option>Solana</option>
        </select>
      </div>
      <div class="field rounded-xl p-4 mb-4 flex items-center justify-between">
        <div>
          <input id="amt" type="number" step="any" placeholder="0.00" class="bg-transparent text-3xl outline-none w-32" />
          <div class="text-xs text-gray-500 mt-1" id="receive">You'll receive ≈ —</div>
        </div>
        <span class="text-xs accent bg-[#2a2018] px-3 py-1.5 rounded-full">E ETH</span>
      </div>
      <div class="flex justify-between text-xs text-gray-500 mb-1"><span>Est. time</span><span>≈ 4 min</span></div>
      <div class="flex justify-between text-xs text-gray-500 mb-4"><span>Bridge fee</span><span>0.002 ETH</span></div>
      <div class="field rounded-xl p-3 text-xs text-gray-400 mb-6 flex items-start gap-2">
        <span class="accent">◆</span> Verified by zk light-client proof — no custodial multisig holds your funds
      </div>
      <button id="review" class="btn w-full py-4 rounded-2xl mt-auto">Review Bridge</button>
    </div>
    <div class="flex gap-2 mt-4 text-xs">
      <a href="https://cypheranon-dev.github.io/Maskswap/" class="flex-1 text-center py-2 rounded-lg border border-gray-800">Swap</a>
      <a href="https://cypheranon-dev.github.io/Maskwallet/" class="flex-1 text-center py-2 rounded-lg border border-gray-800">Wallet</a>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
    document.getElementById('amt').oninput = function(){
      const v = parseFloat(this.value)||0;
      document.getElementById('receive').textContent = 'You\'ll receive ≈ ' + (v*0.998).toFixed(3) + ' cETH';
    };
    document.getElementById('review').onclick = () => {
      const amt = document.getElementById('amt').value;
      if(!amt || amt<=0) return toast('Enter amount');
      toast('Bridge prepared · zk light-client');
    };
  </script>
</body>
</html>
